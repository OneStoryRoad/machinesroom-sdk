name: Publish SDK to npm

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact main commit SHA to publish"
        required: true
        type: string
      dry_run:
        description: "Run npm publish --dry-run without uploading packages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: publish SDK packages
    runs-on: ubuntu-latest
    environment: npm-production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify release commit
        run: |
          set -euo pipefail
          if [ "${{ inputs.expected_sha }}" != "${{ github.sha }}" ]; then
            echo "::error::Expected ${{ inputs.expected_sha }} but workflow is running on ${{ github.sha }}"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm version with trusted publishing support
        run: npm install --global --ignore-scripts npm@11.13.0

      - name: Verify npm trusted-publishing runtime
        run: |
          set -euo pipefail
          node --version
          npm --version
          node - <<'NODE'
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 22 || (major === 22 && minor < 14)) {
            throw new Error(`npm trusted publishing requires Node 22.14.0 or newer; got ${process.versions.node}`);
          }
          NODE
          node - <<'NODE'
          const { execSync } = require("node:child_process");
          const version = execSync("npm --version", { encoding: "utf8" }).trim();
          const [major, minor] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) {
            throw new Error(`npm trusted publishing requires npm 11.5.1 or newer; got ${version}`);
          }
          NODE

      - name: Install dependencies
        run: pnpm ci:install

      - name: Verify SDK packages
        run: |
          set -euo pipefail
          pnpm --filter @machinesroom/contracts test
          pnpm --filter @machinesroom/api-client test
          pnpm check:sdk-package

      - name: Pack publish artifacts
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/machinesroom-npm-packages"
          mkdir -p "$pack_dir"
          pnpm --filter @machinesroom/contracts pack --pack-destination "$pack_dir"
          pnpm --filter @machinesroom/api-client pack --pack-destination "$pack_dir"

          contracts_tgz="$(find "$pack_dir" -maxdepth 1 -name 'machinesroom-contracts-*.tgz' -print -quit)"
          api_client_tgz="$(find "$pack_dir" -maxdepth 1 -name 'machinesroom-api-client-*.tgz' -print -quit)"
          if [ -z "$contracts_tgz" ] || [ -z "$api_client_tgz" ]; then
            echo "::error::Missing expected SDK package tarballs"
            find "$pack_dir" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "pack_dir=$pack_dir" >> "$GITHUB_OUTPUT"
          echo "contracts_tgz=$contracts_tgz" >> "$GITHUB_OUTPUT"
          echo "api_client_tgz=$api_client_tgz" >> "$GITHUB_OUTPUT"

      - name: Validate packed metadata
        run: |
          set -euo pipefail
          node - "${{ steps.pack.outputs.contracts_tgz }}" "${{ steps.pack.outputs.api_client_tgz }}" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const [contractsTgz, apiClientTgz] = process.argv.slice(2);
          function readManifest(tarball) {
            return JSON.parse(execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }));
          }
          const contracts = readManifest(contractsTgz);
          const apiClient = readManifest(apiClientTgz);
          if (contracts.name !== "@machinesroom/contracts") {
            throw new Error(`Unexpected contracts package name: ${contracts.name}`);
          }
          if (apiClient.name !== "@machinesroom/api-client") {
            throw new Error(`Unexpected api-client package name: ${apiClient.name}`);
          }
          if (apiClient.dependencies?.["@machinesroom/contracts"] !== contracts.version) {
            throw new Error(
              `api-client must depend on packed contracts version ${contracts.version}; got ${apiClient.dependencies?.["@machinesroom/contracts"]}`
            );
          }
          for (const manifest of [contracts, apiClient]) {
            if (manifest.private) throw new Error(`${manifest.name} must not be private`);
            if (manifest.publishConfig?.access !== "public") throw new Error(`${manifest.name} must publish publicly`);
          }
          console.log(`${contracts.name}@${contracts.version}`);
          console.log(`${apiClient.name}@${apiClient.version}`);
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machinesroom-npm-packages
          path: ${{ steps.pack.outputs.pack_dir }}/*.tgz
          if-no-files-found: error

      - name: Publish SDK packages with trusted publishing
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONTRACTS_TGZ: ${{ steps.pack.outputs.contracts_tgz }}
          API_CLIENT_TGZ: ${{ steps.pack.outputs.api_client_tgz }}
        run: |
          bash scripts/ops/publish-sdk-packages.sh
